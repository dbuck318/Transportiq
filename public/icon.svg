<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="trailerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Base (Safe for maskable & standard launchers) -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="104" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Minimalist Speed / Ground Lines -->
  <line x1="56" y1="366" x2="456" y2="366" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12"/>

  <!-- Minimalist Transport Truck Group (Centered in 512x512 canvas) -->
  <g transform="translate(64, 150)">
    <!-- Cargo Box / Trailer Body -->
    <rect x="0" y="20" width="248" height="150" rx="12" fill="url(#trailerGrad)"/>
    <!-- Trailer Subtle Accent Stripe -->
    <rect x="0" y="86" width="248" height="18" fill="#3b82f6" opacity="0.9"/>
    
    <!-- Trailer Hitch Connector -->
    <rect x="242" y="118" width="28" height="16" rx="4" fill="#64748b"/>

    <!-- Truck Cab -->
    <path d="M 264,68
             L 320,68
             Q 344,68 358,88
             L 384,124
             Q 392,135 392,148
             L 392,170
             L 264,170 Z" fill="url(#cabGrad)"/>

    <!-- Cab Windshield & Window -->
    <path d="M 278,82
             L 320,82
             Q 336,82 346,96
             L 364,122
             Q 366,125 366,128
             L 278,128 Z" fill="#93c5fd" opacity="0.95"/>

    <!-- Cab Headlight -->
    <rect x="382" y="146" width="10" height="14" rx="4" fill="#fbbf24"/>

    <!-- Wheels & Undercarriage (3 sets of heavy-duty tandem & steer wheels) -->
    <!-- Steer Wheel (Front) -->
    <g transform="translate(346, 170)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#475569" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>

    <!-- Trailer Rear Tandem Wheels -->
    <g transform="translate(68, 170)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#475569" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>
    <g transform="translate(130, 170)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#475569" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>
    <!-- Drive Axle Wheel (Under cab rear) -->
    <g transform="translate(236, 170)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#475569" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#1e293b"/>
    </g>
  </g>
</svg>